site_name: BayServer Documentation
site_description: Manual for BayServer — multi-language web / proxy server
site_url: https://baykit.github.io/BayServer_Docs/
repo_url: https://github.com/baykit/BayServer_Docs
repo_name: baykit/BayServer_Docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  logo: assets/bayserver-logo.png
  favicon: assets/favicon.ico
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  palette:
    # slate (dark) を default にする — OS の prefers-color-scheme は無視
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 朝の海 (ライトモード)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 夜の海 (ダークモード)
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            ホーム: Home
            はじめに: Getting Started
            ガイド: Guide
            リファレンス: Reference
            アーキテクチャ: Architecture
            言語別: Language Implementations
            パフォーマンス: Performance
            開発者向け: Developer
            FAQ: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Version 3 アーカイブ (= 古い情報) はナビに出さない。直接 URL でのみ到達可能。
not_in_nav: |
  /ja/v3/*
  /en/v3/*

nav:
  - ホーム: index.md
  - はじめに: about.md
  - 入門ページ:
      - getting-started/index.md
      - インストール: getting-started/install.md
      - Hello World: getting-started/hello-world.md
      - チュートリアル:
          - getting-started/tutorial/index.md
          - Part 1 静的サイト: getting-started/tutorial/part1-static.md
          - Part 2 HTTPS 化: getting-started/tutorial/part2-https.md
          - Part 3 リバプロを足す: getting-started/tutorial/part3-warp.md
  - ガイド:
      - guide/index.md
      - PHP を使う: guide/php.md
      - php-fpm を使う: guide/php-fpm.md
      - WordPress を動かす: guide/wordpress.md
      - Servlet を使う: guide/servlet.md
      - Rails を使う: guide/rails.md
      - WSGI を使う: guide/wsgi.md
      - リバースプロキシ: guide/reverse-proxy.md
      - HTTPS / TLS: guide/https.md
      - Let's Encrypt: guide/letsencrypt.md
      - HTTP/3: guide/http3.md
      - アクセス制限: guide/access-control.md
      - 他サーバからの移行: guide/migration.md
  - 実例集:
      - examples/index.md
      - Rails アプリ: examples/rails.md
      - WordPress 完全構成: examples/wordpress-full.md
  - リファレンス:
      - reference/index.md
      - 設計ファイル (.plan) リファレンス: reference/plan-reference.md
      - 用語集: reference/glossary.md
  - 仕組みを知る:
      - architecture/index.md
      - Tour / Ship / Agent: architecture/tour-ship-agent.md
      - Multiplexer: architecture/multiplexer.md
      - なぜ BayServer か: architecture/why-bayserver.md
  - 言語別:
      - languages/index.md
      - 機能比較表: languages/comparison.md
      - Java: languages/java.md
      - PHP: languages/php.md
      - Ruby: languages/ruby.md
      - Python: languages/python.md
      - TypeScript: languages/typescript.md
      - Go: languages/go.md
  - パフォーマンス:
      - performance/index.md
      - Tuning ガイド: performance/tuning.md
      - Tips: performance/tips.md
      - ベンチマーク方法論: performance/benchmarks.md
  - 開発者向け:
      - developer/index.md
      - ビルド方法: developer/building.md
      - コーディングスタイル: developer/coding-style.md
      - 新しい Docker を書く: developer/adding-a-docker.md
      - 内部実装の地図: developer/internals.md
  - What's New: whats-new.md
  - FAQ: faq.md
