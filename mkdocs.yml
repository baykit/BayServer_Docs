site_name: BayServer Documentation
site_description: Manual for BayServer — multi-language web / proxy server
site_url: https://baykit.github.io/BayServer_Docs/
repo_url: https://github.com/baykit/BayServer_Docs
repo_name: baykit/BayServer_Docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  logo: assets/bayserver-logo.png
  favicon: assets/favicon.ico
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  palette:
    # slate (dark) を default にする — OS の prefers-color-scheme は無視
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 朝の海 (ライトモード)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 夜の海 (ダークモード)
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            ホーム: Home
            はじめに: Getting Started
            ガイド: Guide
            リファレンス: Reference
            アーキテクチャ: Architecture
            言語別: Language Implementations
            パフォーマンス: Performance
            開発者向け: Developer
            FAQ: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - ホーム: index.md
  - はじめに:
      - getting-started/index.md
      - インストール: getting-started/install.md
      - Hello World: getting-started/hello-world.md
  - ガイド:
      - guide/index.md
      - リバースプロキシ: guide/reverse-proxy.md
      - HTTPS / TLS: guide/https.md
      - Let's Encrypt: guide/letsencrypt.md
      - アクセス制限: guide/access-control.md
      - HTTP/3: guide/http3.md
      - WordPress: guide/wordpress.md
  - リファレンス:
      - reference/index.md
      - .plan 文法: reference/plan-syntax.md
      - Docker 種別: reference/docker-types.md
  - アーキテクチャ:
      - architecture/index.md
      - BayServer とは: architecture/overview.md
  - 言語別:
      - languages/index.md
      - 機能比較表: languages/comparison.md
      - Java: languages/java.md
      - PHP: languages/php.md
      - Ruby: languages/ruby.md
      - Python: languages/python.md
      - TypeScript: languages/typescript.md
      - C: languages/c.md
  - パフォーマンス:
      - performance/index.md
  - 開発者向け:
      - developer/index.md
  - FAQ: faq.md
